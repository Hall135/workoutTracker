<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111519">
    <title>Workout Trends · Workout Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/fitness_center.png" type="image/png">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="container brand"><i class="material-icons" aria-hidden="true">fitness_center</i> Workout Tracker</div>
    </header>
    <main class="container">
        <header class="page-heading">
            <h1>Workout Trends</h1>
            <p>Explore your progress by exercise, weight, and reps.</p>
        </header>
        <section class="card filter-grid" aria-label="Chart filters">
            <div class="field"><label for="graphMetricSelect">Graph by</label><select id="graphMetricSelect" onchange="toggleGraphMetric()"><option value="reps">Reps</option><option value="weight">Weight</option></select></div>
            <div class="field"><label for="graphPlanSelect">Plan</label><select id="graphPlanSelect" onchange="updateExerciseSelect()"></select></div>
            <div class="field"><label for="graphExerciseSelect">Exercise</label><select id="graphExerciseSelect" onchange="updateSetSelect()"></select></div>
            <div class="field"><label for="graphSetSelect">Set</label><select id="graphSetSelect" onchange="renderGraph()"></select></div>
            <div class="field"><label id="metricFilterLabel" for="metricFilterInput">Min reps</label><input type="number" id="metricFilterInput" min="0" step="any" value="0" oninput="renderGraph()"></div>
        </section>
        <section class="card" aria-label="Progress chart">
            <p id="graphEmpty" class="empty-state" hidden>No sets match these filters. Record a workout or adjust your selection.</p>
            <div class="chart-container"><canvas id="trendChart" role="img" aria-label="Workout progress over time">Your workout progress chart.</canvas></div>
        </section>
    </main>
    <nav class="nav" aria-label="Main navigation">
        <a href="./index.html" class="navLink">
            <i class="material-icons navIcon" aria-hidden="true">dashboard</i>
            <span class="navText">Dashboard</span>
        </a>
        <a href="./historyTab.html" class="navLink">
            <i class="material-icons navIcon" aria-hidden="true">history</i>
            <span class="navText">History</span>
        </a>
        <a href="./graphsTab.html" class="navLink navLinkActive" aria-current="page">
            <i class="material-icons navIcon" aria-hidden="true">show_chart</i>
            <span class="navText">Graphs</span>
        </a>
        <a href="./developerTab.html" class="navLink">
            <i class="material-icons navIcon" aria-hidden="true">settings</i>
            <span class="navText">Developer</span>
        </a>
    </nav>
    <script src="./libs/chartjs/chart.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/dataTransfer.js"></script>
    <script src="./js/app.js"></script>
    <script>
        initGraphs();
        // Register on every entry page so each screen can be installed and used offline.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .catch(error => console.error('Service worker registration failed:', error));
            });
        }
    </script>
</body>
</html>
